<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9-V sinf — kelgan ma'lumotlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, query, orderBy, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAVUpLzABT8o_-kDspxCVaAO3CMPUZII04",
    authDomain: "malumnotalr.firebaseapp.com",
    projectId: "malumnotalr",
    storageBucket: "malumnotalr.firebasestorage.app",
    messagingSenderId: "573521817927",
    appId: "1:573521817927:web:96bd83130dd1afe1c89c62"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const lockScreen = document.getElementById("lockScreen");
  const appScreen = document.getElementById("appScreen");
  const passInput = document.getElementById("passInput");
  const emailInput = document.getElementById("emailInput");
  const passBtn = document.getElementById("passBtn");
  const passError = document.getElementById("passError");
  const logoutBtn = document.getElementById("logoutBtn");

  async function tryUnlock() {
    const email = emailInput.value.trim();
    const password = passInput.value;
    if (!email || !password) {
      passError.textContent = "Email va parolni kiriting.";
      return;
    }
    passBtn.disabled = true;
    passBtn.textContent = "Tekshirilmoqda...";
    passError.textContent = "";
    try {
      await signInWithEmailAndPassword(auth, email, password);
      // onAuthStateChanged will handle showing the app
    } catch (err) {
      passError.textContent = "Email yoki parol noto'g'ri.";
      passInput.value = "";
    } finally {
      passBtn.disabled = false;
      passBtn.textContent = "Kirish";
    }
  }

  passBtn.addEventListener("click", tryUnlock);
  passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
  emailInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
  logoutBtn.addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      lockScreen.style.display = "none";
      appScreen.style.display = "block";
      initApp();
    } else {
      lockScreen.style.display = "flex";
      appScreen.style.display = "none";
      emailInput.focus();
    }
  });

  function initApp() {

  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  const emptyEl = document.getElementById("empty");
  const searchEl = document.getElementById("search");
  const clearBtn = document.getElementById("clearSearch");
  const skeletonEl = document.getElementById("skeleton");
  const toastEl = document.getElementById("toast");

  let allDocs = [];
  let openId = null;

  const AVATAR_COLORS = ["#1f4d3e", "#b8863c", "#6a5a8c", "#2f6f56", "#a1522f", "#3f6b8c", "#7a4a4a", "#4a7a6a"];

  function colorFor(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }

  function initials(name) {
    const parts = (name || "").trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0][0].toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1600);
  }

  window.toggleCard = function (id) {
    openId = openId === id ? null : id;
    render(searchEl.value);
  };

  window.copyText = function (event, text) {
    event.stopPropagation();
    navigator.clipboard.writeText(text).then(() => showToast("Nusxalandi ✓"));
  };

  function render(filterText = "") {
    const term = filterText.trim().toLowerCase();
    const filtered = allDocs.filter(d =>
      (d.fullName || "").toLowerCase().includes(term) ||
      (d.address || "").toLowerCase().includes(term) ||
      (d.mfy || "").toLowerCase().includes(term)
    );

    countEl.textContent = `Jami: ${allDocs.length} ta${term ? ` · Topildi: ${filtered.length} ta` : ""}`;
    clearBtn.style.display = term ? "flex" : "none";

    if (filtered.length === 0) {
      listEl.innerHTML = "";
      emptyEl.style.display = "block";
      emptyEl.textContent = allDocs.length === 0
        ? "Hozircha hech qanday ma'lumot tushmagan."
        : "Hech narsa topilmadi. Boshqa so'z bilan qidiring.";
      return;
    }
    emptyEl.style.display = "none";

    listEl.innerHTML = filtered.map((d, i) => {
      const name = d.fullName || "—";
      const isOpen = openId === d.id;
      const color = colorFor(name);
      const parentsBlock = (d.fatherName || d.motherName)
        ? `
          <div class="detail-row">
            <span class="detail-icon">👨</span>
            <div><span class="detail-label">Otasi</span><div class="detail-value">${escapeHtml(d.fatherName || "—")}</div></div>
          </div>
          <div class="detail-row">
            <span class="detail-icon">👩</span>
            <div><span class="detail-label">Onasi</span><div class="detail-value">${escapeHtml(d.motherName || "—")}</div></div>
          </div>`
        : `
          <div class="detail-row">
            <span class="detail-icon">👪</span>
            <div><span class="detail-label">Ota-ona</span><div class="detail-value">${escapeHtml(d.parentInfo || "—")}</div></div>
          </div>`;

      return `
      <div class="card ${isOpen ? "open" : ""}" onclick="toggleCard('${d.id}')">
        <div class="card-head">
          <div class="avatar" style="background:${color}">${initials(name)}</div>
          <div class="card-title">
            <h3>${escapeHtml(name)}</h3>
            <div class="sub">${escapeHtml(d.mfy || "")} ${d.mfy ? "MFY" : ""}</div>
          </div>
          <div class="head-right">
            <span class="time">${d.createdAtStr || ""}</span>
            <span class="chevron">⌄</span>
          </div>
        </div>
        <div class="card-details">
          <div class="detail-row" onclick="copyText(event, '${escapeHtml(d.address || "")}')">
            <span class="detail-icon">📍</span>
            <div><span class="detail-label">Manzil</span><div class="detail-value">${escapeHtml(d.address || "—")}</div></div>
            <span class="copy-hint">nusxa</span>
          </div>
          ${parentsBlock}
          <div class="detail-row" onclick="copyText(event, '${escapeHtml(d.documentInfo || "")}')">
            <span class="detail-icon">🪪</span>
            <div><span class="detail-label">Metrika</span><div class="detail-value">${escapeHtml(d.documentInfo || "—")}</div></div>
            <span class="copy-hint">nusxa</span>
          </div>
        </div>
      </div>
    `;
    }).join("");
  }

  searchEl.addEventListener("input", () => render(searchEl.value));
  clearBtn.addEventListener("click", () => {
    searchEl.value = "";
    searchEl.focus();
    render("");
  });

  const q = query(collection(db, "oquvchilar"), orderBy("createdAt", "desc"));

  onSnapshot(q, (snapshot) => {
    skeletonEl.style.display = "none";
    allDocs = snapshot.docs.map(docSnap => {
      const data = docSnap.data();
      let createdAtStr = "";
      if (data.createdAt && data.createdAt.toDate) {
        createdAtStr = data.createdAt.toDate().toLocaleString("uz-UZ", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
      }
      return { id: docSnap.id, ...data, createdAtStr };
    });
    render(searchEl.value);
  }, (err) => {
    skeletonEl.style.display = "none";
    listEl.innerHTML = `<p style="color:#b23a3a;">Xatolik: ${err.message}</p>`;
  });

  } // end initApp
</script>

<style>
  :root {
    --ink: #1c2b24;
    --ink-soft: #5b6b62;
    --ink-faint: #8b978f;
    --paper: #faf8f2;
    --card: #ffffff;
    --line: #e4ded0;
    --line-soft: #ece7db;
    --field: #f6f3e9;
    --pine: #1f4d3e;
    --pine-dark: #163a2f;
    --pine-tint: #eaf1ec;
    --gold: #b8863c;
    --danger: #b23a3a;
    --shadow-1: 0 1px 2px rgba(28, 43, 36, 0.04);
    --shadow-2: 0 12px 32px rgba(28, 43, 36, 0.10), 0 2px 8px rgba(28, 43, 36, 0.05);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    background: var(--paper);
    background-image:
      linear-gradient(180deg, var(--pine) 0%, var(--pine) 108px, transparent 108px),
      radial-gradient(circle at 90% 0%, rgba(184,134,60,0.06), transparent 45%);
    margin: 0;
    padding: 32px 16px 60px;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }

  header {
    max-width: 760px;
    margin: 0 auto 22px;
    position: relative;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #eef3ee;
    margin: 0 0 20px;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }
  .brand-text { font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; }
  .brand-text span {
    display: block;
    font-size: 11.5px;
    font-weight: 500;
    color: rgba(238,243,238,0.68);
    margin-top: 1px;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: 20px;
    box-shadow: var(--shadow-2);
    padding: 20px 22px 22px;
  }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 21px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  #count { color: var(--ink-faint); font-size: 13px; font-weight: 500; }

  .search-wrap { position: relative; margin-top: 16px; }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-faint);
    font-size: 14px;
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 12px 40px 12px 40px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 14.5px;
    outline: none;
    background: var(--field);
    color: var(--ink);
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  #search::placeholder { color: var(--ink-faint); }
  #search:focus {
    border-color: var(--pine);
    box-shadow: 0 0 0 4px rgba(31,77,62,0.10);
    background: #fff;
  }
  #clearSearch {
    display: none;
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: var(--line-soft);
    color: var(--ink-soft);
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 13px;
  }
  #clearSearch:hover { background: #e0dabf; }

  #logoutBtn {
    position: absolute;
    top: -46px;
    right: 0;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.22);
    color: #eef3ee;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 9px;
    cursor: pointer;
    font-family: inherit;
  }
  #logoutBtn:hover { background: rgba(255,255,255,0.18); }

  .container {
    max-width: 760px;
    margin: 18px auto 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .skeleton-card {
    height: 68px;
    border-radius: 14px;
    background: linear-gradient(90deg, var(--line-soft) 25%, #f7f5ec 37%, var(--line-soft) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    margin-bottom: 10px;
  }
  @keyframes shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .skeleton-card { animation: none; }
  }

  .card {
    background: var(--card);
    border: 1.5px solid var(--line-soft);
    border-radius: 15px;
    cursor: pointer;
    transition: box-shadow .18s, border-color .18s, transform .12s;
    animation: fadeIn .28s ease both;
  }
  .card:hover { box-shadow: var(--shadow-1); border-color: var(--line); }
  .card:active { transform: scale(0.997); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
  }
  .avatar {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 11px;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-title { flex: 1; min-width: 0; }
  .card-title h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub { font-size: 12px; color: var(--ink-faint); margin-top: 1px; }
  .head-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .time { font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; }
  .chevron { color: var(--ink-faint); font-size: 18px; line-height: 1; transition: transform .2s; }
  .card.open .chevron { transform: rotate(180deg); color: var(--pine); }

  .card-details {
    max-height: 0;
    overflow: hidden;
    transition: max-height .25s ease, padding .25s ease;
    padding: 0 16px;
  }
  .card.open .card-details { max-height: 400px; padding: 2px 16px 14px; }
  .detail-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 9px;
    transition: background .12s;
  }
  .detail-row:hover { background: var(--field); }
  .detail-icon { font-size: 15px; margin-top: 1px; }
  .detail-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }
  .detail-value { font-size: 14px; color: var(--ink); margin-top: 1px; line-height: 1.4; }
  .copy-hint {
    margin-left: auto;
    font-size: 11px;
    color: var(--pine);
    font-weight: 600;
    opacity: 0;
    transition: opacity .12s;
    align-self: center;
    flex-shrink: 0;
  }
  .detail-row:hover .copy-hint { opacity: 1; }

  #empty {
    display: none;
    text-align: center;
    color: var(--ink-faint);
    font-size: 14px;
    padding: 50px 20px;
    max-width: 760px;
    margin: 0 auto;
  }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--pine-dark);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .lock-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .lock-box {
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: 20px;
    max-width: 340px;
    width: 100%;
    padding: 34px 26px 28px;
    text-align: center;
    box-shadow: var(--shadow-2);
  }
  .lock-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: var(--pine-tint);
    border: 1px solid #d9e6dd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin: 0 auto 16px;
  }
  .lock-box h2 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .lock-box p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.55; margin: 0 0 20px; }
  #emailInput, #passInput {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    text-align: center;
    background: var(--field);
    color: var(--ink);
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  #passInput { letter-spacing: 0.05em; margin-top: 10px; }
  #emailInput:focus, #passInput:focus {
    border-color: var(--pine);
    box-shadow: 0 0 0 4px rgba(31,77,62,0.10);
    background: #fff;
  }
  .lock-error { color: var(--danger); font-size: 12.5px; min-height: 16px; margin-top: 8px; }
  #passBtn {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--pine);
    color: #fff;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s;
  }
  #passBtn:hover { background: var(--pine-dark); }
  #passBtn:disabled { opacity: 0.6; cursor: default; }

  @media (max-width: 420px) {
    #logoutBtn { position: static; margin-bottom: 12px; }
    .brand { margin-bottom: 14px; }
  }
</style>
</head>
<body>

<div class="lock-wrap" id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <h2>Kirish</h2>
    <p>Bu sahifa faqat sinf rahbari uchun. Davom etish uchun tizimga kiring.</p>
    <input type="email" id="emailInput" placeholder="Email" autocomplete="username">
    <input type="password" id="passInput" placeholder="Parol" autocomplete="current-password">
    <div class="lock-error" id="passError"></div>
    <button type="button" id="passBtn">Kirish</button>
  </div>
</div>

<div id="appScreen" style="display:none;">

<header>
  <div class="brand">
    <div class="brand-mark">9V</div>
    <div class="brand-text">9-"V" sinf<span>Kelib tushgan ma'lumotlar</span></div>
  </div>
  <button type="button" id="logoutBtn">Chiqish</button>
  <div class="panel">
    <div class="title-row">
      <h1>O'quvchilar ro'yxati</h1>
      <span id="count">Yuklanmoqda...</span>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Ism, manzil yoki MFY bo'yicha qidirish...">
      <button id="clearSearch" type="button" aria-label="Tozalash">✕</button>
    </div>
  </div>
</header>

<div class="container">
  <div id="skeleton">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </div>
  <div id="list"></div>
</div>
<div id="empty">Hozircha hech qanday ma'lumot tushmagan.</div>
<div id="toast"></div>

</div>

</body>
</html>
