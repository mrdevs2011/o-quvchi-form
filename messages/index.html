<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9-V sinf — kelgan ma'lumotlar</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, query, orderBy, onSnapshot, doc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAVUpLzABT8o_-kDspxCVaAO3CMPUZII04",
    authDomain: "malumnotalr.firebaseapp.com",
    projectId: "malumnotalr",
    storageBucket: "malumnotalr.firebasestorage.app",
    messagingSenderId: "573521817927",
    appId: "1:573521817927:web:96bd83130dd1afe1c89c62"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const lockScreen = document.getElementById("lockScreen");
  const appScreen = document.getElementById("appScreen");
  const passInput = document.getElementById("passInput");
  const passBtn = document.getElementById("passBtn");
  const passError = document.getElementById("passError");

  const SESSION_KEY = "msgs_unlocked_9v";

  async function checkPassword(value) {
    const snap = await getDoc(doc(db, "PASS", "main"));
    if (!snap.exists()) return false;
    const correct = snap.data().value;
    return String(value) === String(correct);
  }

  async function tryUnlock() {
    const value = passInput.value.trim();
    if (!value) return;
    passBtn.disabled = true;
    passBtn.textContent = "Tekshirilmoqda...";
    passError.textContent = "";
    try {
      const ok = await checkPassword(value);
      if (ok) {
        sessionStorage.setItem(SESSION_KEY, "1");
        lockScreen.style.display = "none";
        appScreen.style.display = "block";
        initApp();
      } else {
        passError.textContent = "Parol noto'g'ri.";
        passInput.value = "";
        passInput.focus();
      }
    } catch (err) {
      passError.textContent = "Xatolik: " + err.message;
    } finally {
      passBtn.disabled = false;
      passBtn.textContent = "Kirish";
    }
  }

  passBtn.addEventListener("click", tryUnlock);
  passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });

  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    lockScreen.style.display = "none";
    appScreen.style.display = "block";
    initApp();
  } else {
    passInput.focus();
  }

  function initApp() {

  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  const emptyEl = document.getElementById("empty");
  const searchEl = document.getElementById("search");
  const clearBtn = document.getElementById("clearSearch");
  const skeletonEl = document.getElementById("skeleton");
  const toastEl = document.getElementById("toast");

  let allDocs = [];
  let openId = null;

  const AVATAR_COLORS = ["#6366f1", "#ec4899", "#0ea5e9", "#10b981", "#f59e0b", "#8b5cf6", "#ef4444", "#14b8a6"];

  function colorFor(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }

  function initials(name) {
    const parts = (name || "").trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0][0].toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1600);
  }

  window.toggleCard = function (id) {
    openId = openId === id ? null : id;
    render(searchEl.value);
  };

  window.copyText = function (event, text) {
    event.stopPropagation();
    navigator.clipboard.writeText(text).then(() => showToast("Nusxalandi ✓"));
  };

  function render(filterText = "") {
    const term = filterText.trim().toLowerCase();
    const filtered = allDocs.filter(d =>
      (d.fullName || "").toLowerCase().includes(term) ||
      (d.address || "").toLowerCase().includes(term) ||
      (d.mfy || "").toLowerCase().includes(term)
    );

    countEl.textContent = `Jami: ${allDocs.length} ta${term ? ` · Topildi: ${filtered.length} ta` : ""}`;
    clearBtn.style.display = term ? "flex" : "none";

    if (filtered.length === 0) {
      listEl.innerHTML = "";
      emptyEl.style.display = "block";
      emptyEl.textContent = allDocs.length === 0
        ? "Hozircha hech qanday ma'lumot tushmagan."
        : "Hech narsa topilmadi. Boshqa so'z bilan qidiring.";
      return;
    }
    emptyEl.style.display = "none";

    listEl.innerHTML = filtered.map((d, i) => {
      const name = d.fullName || "—";
      const isOpen = openId === d.id;
      const color = colorFor(name);
      const parentsBlock = (d.fatherName || d.motherName)
        ? `
          <div class="detail-row">
            <span class="detail-icon">👨</span>
            <div><span class="detail-label">Otasi</span><div class="detail-value">${escapeHtml(d.fatherName || "—")}</div></div>
          </div>
          <div class="detail-row">
            <span class="detail-icon">👩</span>
            <div><span class="detail-label">Onasi</span><div class="detail-value">${escapeHtml(d.motherName || "—")}</div></div>
          </div>`
        : `
          <div class="detail-row">
            <span class="detail-icon">👪</span>
            <div><span class="detail-label">Ota-ona</span><div class="detail-value">${escapeHtml(d.parentInfo || "—")}</div></div>
          </div>`;

      return `
      <div class="card ${isOpen ? "open" : ""}" onclick="toggleCard('${d.id}')">
        <div class="card-head">
          <div class="avatar" style="background:${color}">${initials(name)}</div>
          <div class="card-title">
            <h3>${escapeHtml(name)}</h3>
            <div class="sub">${escapeHtml(d.mfy || "")} ${d.mfy ? "MFY" : ""}</div>
          </div>
          <div class="head-right">
            <span class="time">${d.createdAtStr || ""}</span>
            <span class="chevron">⌄</span>
          </div>
        </div>
        <div class="card-details">
          <div class="detail-row" onclick="copyText(event, '${escapeHtml(d.address || "")}')">
            <span class="detail-icon">📍</span>
            <div><span class="detail-label">Manzil</span><div class="detail-value">${escapeHtml(d.address || "—")}</div></div>
            <span class="copy-hint">nusxa</span>
          </div>
          ${parentsBlock}
          <div class="detail-row" onclick="copyText(event, '${escapeHtml(d.documentInfo || "")}')">
            <span class="detail-icon">🪪</span>
            <div><span class="detail-label">Metrika</span><div class="detail-value">${escapeHtml(d.documentInfo || "—")}</div></div>
            <span class="copy-hint">nusxa</span>
          </div>
        </div>
      </div>
    `;
    }).join("");
  }

  searchEl.addEventListener("input", () => render(searchEl.value));
  clearBtn.addEventListener("click", () => {
    searchEl.value = "";
    searchEl.focus();
    render("");
  });

  const q = query(collection(db, "oquvchilar"), orderBy("createdAt", "desc"));

  onSnapshot(q, (snapshot) => {
    skeletonEl.style.display = "none";
    allDocs = snapshot.docs.map(docSnap => {
      const data = docSnap.data();
      let createdAtStr = "";
      if (data.createdAt && data.createdAt.toDate) {
        createdAtStr = data.createdAt.toDate().toLocaleString("uz-UZ", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
      }
      return { id: docSnap.id, ...data, createdAtStr };
    });
    render(searchEl.value);
  }, (err) => {
    skeletonEl.style.display = "none";
    listEl.innerHTML = `<p style="color:#d93025;">Xatolik: ${err.message}</p>`;
  });

  } // end initApp
</script>

<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f4f5f9;
    --card: #ffffff;
    --border: #e7e9f0;
    --text: #1a1a2e;
    --muted: #7b8093;
    --accent: #4c6fff;
  }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 24px 16px 60px;
    color: var(--text);
  }
  header {
    max-width: 760px;
    margin: 0 auto 22px;
  }
  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  h1 {
    font-size: 21px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  #count {
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }
  .search-wrap {
    position: relative;
    margin-top: 14px;
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 15px;
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 12px 40px 12px 40px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14.5px;
    outline: none;
    background: var(--card);
    transition: border-color .15s, box-shadow .15s;
  }
  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(76,111,255,0.12);
  }
  #clearSearch {
    display: none;
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: #eef0f5;
    color: var(--muted);
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
  }
  #clearSearch:hover { background: #e2e5ee; }

  .container {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .skeleton-card {
    height: 68px;
    border-radius: 14px;
    background: linear-gradient(90deg, #eceef4 25%, #f6f7fb 37%, #eceef4 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    margin-bottom: 10px;
  }
  @keyframes shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }

  .card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    transition: box-shadow .18s, border-color .18s, transform .12s;
    animation: fadeIn .28s ease both;
  }
  .card:hover {
    box-shadow: 0 4px 18px rgba(20,20,50,0.07);
    border-color: #d8dcec;
  }
  .card:active { transform: scale(0.997); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
  }
  .avatar {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 50%;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-title {
    flex: 1;
    min-width: 0;
  }
  .card-title h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }
  .head-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .time {
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .chevron {
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    transition: transform .2s;
  }
  .card.open .chevron { transform: rotate(180deg); color: var(--accent); }

  .card-details {
    max-height: 0;
    overflow: hidden;
    transition: max-height .25s ease, padding .25s ease;
    padding: 0 16px;
  }
  .card.open .card-details {
    max-height: 400px;
    padding: 2px 16px 14px;
  }
  .detail-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 9px;
    transition: background .12s;
  }
  .detail-row:hover { background: #f6f7fb; }
  .detail-icon { font-size: 15px; margin-top: 1px; }
  .detail-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .detail-value {
    font-size: 14px;
    color: var(--text);
    margin-top: 1px;
    line-height: 1.4;
  }
  .copy-hint {
    margin-left: auto;
    font-size: 11px;
    color: var(--accent);
    opacity: 0;
    transition: opacity .12s;
    align-self: center;
    flex-shrink: 0;
  }
  .detail-row:hover .copy-hint { opacity: 1; }

  #empty {
    display: none;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 50px 20px;
    max-width: 760px;
    margin: 0 auto;
  }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1a2e;
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 50;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .lock-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .lock-box {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    max-width: 340px;
    width: 100%;
    padding: 32px 26px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(20,20,50,0.08);
  }
  .lock-icon { font-size: 34px; margin-bottom: 10px; }
  .lock-box h2 {
    font-size: 18px;
    margin: 0 0 8px;
    color: var(--text);
  }
  .lock-box p {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0 0 18px;
  }
  #passInput {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    text-align: center;
    letter-spacing: 0.05em;
    transition: border-color .15s, box-shadow .15s;
  }
  #passInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(76,111,255,0.12);
  }
  .lock-error {
    color: #d93025;
    font-size: 12.5px;
    min-height: 16px;
    margin-top: 8px;
  }
  #passBtn {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }
  #passBtn:hover { background: #3f5fee; }
  #passBtn:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>

<div class="lock-wrap" id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <h2>Kirish uchun parol</h2>
    <p>Bu sahifa faqat sinf rahbari uchun. Davom etish uchun parolni kiriting.</p>
    <input type="password" id="passInput" placeholder="Parol" autocomplete="off">
    <div class="lock-error" id="passError"></div>
    <button type="button" id="passBtn">Kirish</button>
  </div>
</div>

<div id="appScreen" style="display:none;">

<header>
  <div class="title-row">
    <h1>9-V sinf</h1>
    <span id="count">Yuklanmoqda...</span>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Ism, manzil yoki MFY bo'yicha qidirish...">
    <button id="clearSearch" type="button" aria-label="Tozalash">✕</button>
  </div>
</header>

<div class="container">
  <div id="skeleton">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </div>
  <div id="list"></div>
</div>
<div id="empty">Hozircha hech qanday ma'lumot tushmagan.</div>
<div id="toast"></div>

</div>

</body>
</html>
